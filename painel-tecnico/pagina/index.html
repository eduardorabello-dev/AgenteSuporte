<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Técnico</title>
<link rel="icon" href="/arquivos/visual/icone.svg" type="image/svg+xml">
<script src="/arquivos/visual/preferencias.js"></script>
<link rel="stylesheet" href="/arquivos/visual/base.css">
<link rel="stylesheet" href="/arquivos/visual/componentes.css">
<link rel="stylesheet" href="/arquivos/painel/painel.css">
<link rel="stylesheet" href="/arquivos/painel/admin.css">
</head>
<body class="pagina-tecnico">
<header class="topo">
  <a class="marca" href="/" data-i18n-title="comum.inicio" data-i18n-aria-label="comum.inicio" title="Voltar ao início" aria-label="Voltar ao início">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.4 1.4 0 0 0 2 2l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.1-.6-.6-2.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </a>
  <div class="titulo">
    <h1 data-i18n="painel.titulo">Painel do Técnico</h1>
    <p data-i18n="painel.sub">Chamados que o chat encaminhou para a equipe de suporte.</p>
  </div>
  <span class="estado" id="estado" data-estado="carregando" hidden data-i18n="comum.carregando">Carregando</span>
  <button class="botao-topo so-icone" id="config-anonimo" type="button" data-i18n-aria-label="comum.configuracoes" data-i18n-title="comum.configuracoes" aria-label="Configurações">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <button class="botao-topo usuario" id="usuario" type="button" hidden data-i18n-title="comum.conta_config" title="Conta e configurações">
    <span class="avatar-usuario" id="avatar" aria-hidden="true"></span>
    <span class="nome-usuario"><strong id="nome-usuario"></strong><small id="papel-usuario"></small></span>
  </button>
</header>

<main class="acesso" id="acesso" hidden></main>

<nav class="abas-painel" id="abas-painel" role="tablist" data-i18n-aria-label="admin.areas" aria-label="Áreas do painel" hidden>
  <button type="button" role="tab" data-area="chamados" aria-selected="true" data-i18n="admin.aba_chamados">Chamados</button>
  <button type="button" role="tab" data-area="indicadores" aria-selected="false" data-i18n="admin.aba_indicadores">Indicadores</button>
  <button type="button" role="tab" data-area="contas" aria-selected="false" data-i18n="admin.aba_contas">Contas</button>
</nav>
<main class="painel painel-admin" id="tela-indicadores" hidden></main>
<main class="painel painel-admin" id="tela-contas" hidden></main>

<main class="painel" id="tela-painel" hidden>
  <section aria-labelledby="titulo-equipe">
    <div class="cabecalho-secao">
      <h2 id="titulo-equipe" data-i18n="painel.por_tecnico">Chamados por técnico</h2>
      <a class="link-chat" href="/chat" target="_blank" rel="noopener" data-i18n="painel.abrir_chat">Abrir o chat do colaborador ↗</a>
    </div>
    <div class="equipe" id="equipe" role="tablist" data-i18n-aria-label="painel.escolha" aria-label="Escolha de quem ver os chamados"></div>
  </section>

  <section class="barra" aria-label="Filtros">
    <div class="segmentos" id="segmentos" role="radiogroup" data-i18n-aria-label="painel.situacao" aria-label="Situação"></div>
    <div class="filtros">
      <label class="campo">
        <span class="so-leitor" data-i18n="painel.buscar_curto">Buscar</span>
        <input type="search" id="busca" data-i18n-placeholder="painel.buscar" placeholder="Buscar protocolo, e-mail ou descrição">
      </label>
      <label class="campo">
        <span class="so-leitor" data-i18n="painel.urgencia">Urgência</span>
        <select id="urgencia">
          <option value="" data-i18n="painel.todas_urgencias">Todas as urgências</option>
          <option value="Crítica" data-i18n="v.Crítica">Crítica</option>
          <option value="Alta" data-i18n="v.Alta">Alta</option>
          <option value="Média" data-i18n="v.Média">Média</option>
          <option value="Baixa" data-i18n="v.Baixa">Baixa</option>
        </select>
      </label>
    </div>
  </section>

  <p class="aviso" id="aviso" hidden></p>
  <h3 class="titulo-lista" id="titulo-lista"></h3>
  <div class="lista" id="lista" aria-live="polite"></div>
</main>

<div class="veu" id="veu" hidden></div>
<aside class="gaveta" id="gaveta" role="dialog" aria-modal="true" aria-labelledby="gaveta-titulo" hidden>
  <header class="gaveta-topo">
    <span class="avatar-usuario" id="gaveta-avatar" aria-hidden="true"></span>
    <div class="gaveta-quem">
      <h2 id="gaveta-titulo" data-i18n="gaveta.titulo">Conversa com o usuário</h2>
      <p><span class="presenca" id="presenca"></span> · <span id="gaveta-protocolo"></span></p>
    </div>
    <button class="fechar" id="fechar-gaveta" type="button" data-i18n-aria-label="gaveta.fechar" aria-label="Fechar conversa">×</button>
  </header>
  <p class="gaveta-descricao" id="gaveta-descricao"></p>
  <div class="gaveta-mensagens" id="gaveta-mensagens" role="log" aria-live="polite"></div>
  <div class="gaveta-rodape">
    <p class="aviso" id="gaveta-aviso" hidden></p>
    <div class="gaveta-iniciar" id="gaveta-iniciar" hidden>
      <p data-i18n="gaveta.explica">A pessoa verá suas mensagens no chat dela, e as respostas dela chegam aqui.</p>
      <button class="botao-pri" id="iniciar-conversa" type="button" data-i18n="gaveta.iniciar">Iniciar conversa</button>
    </div>
    <form class="composer" id="gaveta-form" hidden>
      <label class="so-leitor" for="gaveta-texto" data-i18n="gaveta.mensagem_para">Mensagem para o usuário</label>
      <textarea id="gaveta-texto" rows="1" maxlength="2000" data-i18n-placeholder="gaveta.escreva" placeholder="Escreva para o usuário…"></textarea>
      <button class="enviar" type="submit" data-i18n-aria-label="comum.enviar" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="gaveta-acoes" id="gaveta-acoes" hidden>
      <span class="dica-gaveta" data-i18n="comum.enter_curto">Enter envia · Shift+Enter quebra a linha</span>
      <button class="botao-sec" id="encerrar-conversa" type="button" data-i18n="gaveta.encerrar">Encerrar conversa</button>
    </div>
  </div>
</aside>
<script src="/arquivos/visual/idiomas.js"></script>
<script src="/arquivos/visual/acesso.js"></script>
<script src="/arquivos/visual/conta.js"></script>
<script src="/arquivos/painel/admin.js"></script>
<script src="/arquivos/painel/painel.js"></script>
</body>
</html>
